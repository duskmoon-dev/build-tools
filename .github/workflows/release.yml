name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Build CLI
        run: bun build cli/src/index.ts --compile --outfile dm-cli

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dm-cli
